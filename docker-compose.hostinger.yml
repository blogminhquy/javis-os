# ============================================================================
# Javis OS - HOSTINGER VPS (Docker Manager). Tên miền + HTTPS qua Traefik có sẵn của Hostinger,
# hoặc qua Caddy đi kèm (service gateway) khi VPS không có Traefik (mẫu Ubuntu 26 trắng).
#
# File này LUÔN deploy được:
#   - Chưa đặt DOMAIN_NAME  -> chạy tạm, nút Open mở http://<ip>:7777 (chưa có HTTPS).
#   - Đặt DOMAIN_NAME       -> Traefik của Hostinger tự cấp HTTPS cho tên miền đó.
#
# CÁCH DÙNG:
#   1) Docker Manager > Compose > URL > dán:
#      https://raw.githubusercontent.com/blogminhquy/javis-os/main/docker-compose.hostinger.yml
#   2) Ô Environment chỉ còn 4 trường hữu ích:
#        DOMAIN_NAME, JAVIS_ADMIN_USER, JAVIS_ADMIN_PASSWORD, JAVIS_AUTO_UPDATE.
#      (JAVIS_AUTO_UPDATE=true thì Javis TỰ cập nhật mỗi ngày, khỏi bấm nút. Bỏ trống thì
#       cập nhật bằng nút "Cập nhật ngay" trong app - xem service watchtower ở dưới.)
#      (Thêm 2 trường CHỈ CẦN KHI cài bản Javis THỨ HAI trở đi trên cùng VPS - xem cuối file:
#        JAVIS_NAME, JAVIS_HOST_PORT. Cài bản đầu thì bỏ trống cả hai.)
#      Đặt DOMAIN_NAME để có HTTPS:
#        - Link miễn phí (KHÔNG cần mua tên miền):  DOMAIN_NAME=javis.<hostname-vps>.hstgr.cloud
#          (hostname xem ở hPanel > VPS, vd: DOMAIN_NAME=javis.srv1782015.hstgr.cloud)
#        - Hoặc tên miền riêng:  DOMAIN_NAME=tenmien.com  (trỏ DNS A về IP VPS trước).
#   3) Deploy > đợi 1-3 phút Traefik (hoặc gateway) cấp SSL > mở  https://<DOMAIN_NAME>.
#
# KHÔNG tìm thấy ô Environment? Bấm Manage > sửa .yaml, đổi hai dòng nhãn traefik.enable và ...rule thành:
#      - traefik.enable=true
#      - traefik.http.routers.javis.rule=Host(`javis.srv1782015.hstgr.cloud`)   (thay bằng hostname VPS của bạn).
# Không biết hostname VPS? Mở Javis bằng http://<ip>:7777 > Cài đặt > Tên miền: Javis hiện sẵn dòng DOMAIN_NAME=...
#
# GHI CHÚ:
#   - Mấu chốt: KHÔNG khai báo networks - Traefik của Hostinger tự thấy container qua nhãn.
#   - Cập nhật bản mới: bấm "Cập nhật ngay" ngay trong app (trang Cập nhật). Nút đó cần
#     container watchtower đi kèm bên dưới; nó không lên được thì vẫn Redeploy như cũ.
#   - VPS Hostinger KHÔNG có Traefik (mẫu Ubuntu 26 trắng, 0.300.0): vẫn dán đúng link này. Service gateway
#     ở dưới tự thấy cổng 80/443 trống và cấp HTTPS cho DOMAIN_NAME bằng Caddy. Cần Docker (hPanel cài sẵn khi
#     mở Docker Manager, hoặc: curl -fsSL https://get.docker.com | sh) và mở cổng 80, 443 ở tường lửa.
#   - VPS KHÔNG phải Hostinger: bỏ file này, dùng docker-compose.yml + docker-compose.https.yml (Caddy).
#   - Image GHCR phải để PUBLIC (GitHub > Packages > javis-os > Package settings > Public).
# ============================================================================
services:
  javis:
    image: ghcr.io/blogminhquy/javis-os:latest
    # Tên container + tên router/service Traefik đều lấy từ JAVIS_NAME. Bỏ trống = "javis" như cũ.
    # Cài bản THỨ HAI trên cùng VPS thì đặt tên khác (vd javis-shop), nếu không Docker báo tên đã
    # dùng và Traefik có hai router trùng tên nên chỉ lái được về một bản.
    container_name: ${JAVIS_NAME:-javis}
    restart: unless-stopped
    pull_policy: always
    # Gắn target Hostinger bên trong lệnh chạy để KHÔNG biến nó thành một trường rác
    # trong ô Environment của Docker Manager.
    command: ["sh", "-c", "JAVIS_DEPLOY_TARGET=hostinger exec python -m uvicorn main:app --app-dir server --host 0.0.0.0 --port 7777"]
    environment:
      # Chỉ giữ các trường người cài thực sự cần. Cổng/đường dẫn/state/brain đã có
      # mặc định đúng trong Docker image, không cần hiện thành một loạt ô kỹ thuật.
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      JAVIS_ADMIN_USER: ${JAVIS_ADMIN_USER:-admin}
      JAVIS_ADMIN_PASSWORD: ${JAVIS_ADMIN_PASSWORD:-}
      # Chung một token với service watchtower bên dưới -> nút "Cập nhật ngay" gọi được nó.
      # ĐÓNG CỨNG chứ không lấy từ biến, có lý do: mỗi `${...}` trong file này đẻ thêm một ô
      # trong form Environment của Docker Manager, mà token này không ai cần đổi - cổng 8080 của
      # Watchtower không publish ra ngoài, chỉ container trong cùng stack gọi tới được.
      # Muốn token riêng thì dùng docker-compose.yml (bản VPS), nó nhận biến WATCHTOWER_TOKEN.
      WATCHTOWER_TOKEN: javis-update
    ports:
      # Đường vào dự phòng (nút Open / http://<ip>:7777). Bản thứ hai PHẢI đổi cổng này
      # (JAVIS_HOST_PORT=7778) vì một cổng máy chủ chỉ một container giữ được.
      # Bảo mật (sự cố 09/11/2026): ĐÃ đặt DOMAIN_NAME thì cổng này chỉ nghe ở 127.0.0.1. Traefik vào qua mạng Docker,
      # gateway Caddy vào qua 127.0.0.1, nên HTTPS vẫn chạy như cũ; chỉ còn đường http://<ip>:7777 (không mã hoá,
      # mật khẩu đi trần qua mạng) là đóng lại. CHƯA đặt DOMAIN_NAME thì cổng vẫn mở ra ngoài như trước, vì đó là
      # đường vào duy nhất. Tên miền chưa lên HTTPS mà cần vào gấp: xoá DOMAIN_NAME rồi Redeploy là cổng mở lại.
      - "${DOMAIN_NAME:+127.0.0.1:}${JAVIS_HOST_PORT:-7777}:7777"
    labels:
      # Guide (Documentation / Quick start) trong Docker Manager - trỏ docs GitHub.
      - org.opencontainers.image.documentation=https://github.com/blogminhquy/javis-os/blob/main/docs/README.md
      - org.opencontainers.image.source=https://github.com/blogminhquy/javis-os
      - com.hostinger.documentation=https://github.com/blogminhquy/javis-os/blob/main/docs/README.md
      - com.hostinger.quickstart=https://github.com/blogminhquy/javis-os/blob/main/QUICKSTART.md
      # Router/service mang TÊN CỦA BẢN (JAVIS_NAME) chứ không đóng cứng "javis": Traefik đặt tên
      # router theo phạm vi toàn máy, hai bản cùng tên router là bản sau đè bản trước và một
      # trong hai tên miền chết. Bỏ trống JAVIS_NAME thì vẫn ra "javis" y như trước.
      # Host = ${DOMAIN_NAME}. 0.302.0: CHƯA đặt DOMAIN_NAME thì hai nhãn dưới RỖNG thay vì Host(`localhost`).
      # Nút Open của hPanel mở đúng tên miền trong nhãn Host(...) cụ thể; bản cũ để "localhost" nên bấm Open là ra
      # localhost trên máy người bấm (chủ repo báo 24/10/2026). Không có Host cụ thể thì hPanel rơi về cổng đã publish,
      # tức http://<ip-vps>:7777. Nhãn traefik.enable rỗng làm Traefik bỏ qua container, nên cũng không còn route nào
      # cho "localhost". Cú pháp ":+" của compose: chỉ ra chữ khi DOMAIN_NAME có giá trị.
      - traefik.enable=${DOMAIN_NAME:+true}
      - traefik.http.routers.${JAVIS_NAME:-javis}.rule=${DOMAIN_NAME:+Host(`}${DOMAIN_NAME:-}${DOMAIN_NAME:+`)}
      - traefik.http.routers.${JAVIS_NAME:-javis}.entrypoints=websecure
      - traefik.http.routers.${JAVIS_NAME:-javis}.tls.certresolver=letsencrypt
      - traefik.http.routers.${JAVIS_NAME:-javis}.service=${JAVIS_NAME:-javis}
      - traefik.http.services.${JAVIS_NAME:-javis}.loadbalancer.server.port=7777
    volumes:
      - javis-data:/data
      - javis-brains:/brains
      - claude-auth:/home/javis/.claude
      - codex-auth:/home/javis/.codex
      - gateway-status:/gateway:ro   # 0.304.0: trạng thái service gateway bên dưới (chỉ đọc)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:'+os.getenv('JAVIS_PORT','7777')+'/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  # ------------------------------------------------------------------------
  # Cập nhật 1-CLICK từ trong app (nút "Cập nhật ngay" ở trang Cập nhật). CÓ SẴN từ 0.55.56.
  #
  # Lịch sử phải nói thật, vì nó là lý do khối này từng KHÔNG có: bản 2026-07-18 đã thử rồi gỡ
  # đi, do trên Docker Manager container Watchtower bị Restarting liên tục và stack hiện
  # "Partially running". Hồi đó đoán là "không đụng được Docker socket" - SAI. Log thật (đo lại
  # 2026-10-01 trên VPS Hostinger) là:
  #   client version 1.25 is too old. Minimum supported API version is 1.40
  # Image cũ `containrrr/watchtower` mặc định nói Docker API 1.25, Docker Engine mới từ chối.
  # Repo đó đã bị archive (read-only từ 12/2025) nên lỗi không bao giờ được sửa ở đó.
  #
  # Nay dùng bản fork còn bảo trì `nicholas-fedor/watchtower`: TỰ thương lượng phiên bản API với
  # Docker, cùng cổng 8080, cùng `POST /v1/update` + Bearer token mà app đang gọi. Ghim major `:1`
  # để bản v2 (sẽ bỏ các biến HTTP API kiểu cũ) không tự lọt vào làm chết nút lần nữa.
  # ĐỪNG vá bằng DOCKER_API_VERSION=1.40 trên image cũ: Docker còn nâng mức tối thiểu tiếp.
  #
  # Điều KHÔNG đổi: container javis ở trên CHẠY BÌNH THƯỜNG dù Watchtower hỏng. Nó là một
  # container RIÊNG, hỏng thì chỉ mất cái nút, không kéo theo app. Gặp "Partially running" thì
  # mở log container `javis-watchtower`; không sửa được thì cập nhật bằng REDEPLOY y như trước,
  # trang Cập nhật trong app cũng tự nói ra điều đó.
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:1
    container_name: ${JAVIS_NAME:-javis}-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_HTTP_API_ENDPOINTS: update                 # nhận lệnh cập nhật từ nút bấm
      WATCHTOWER_HTTP_API_TOKEN: javis-update               # khớp WATCHTOWER_TOKEN của app ở trên
      # TỰ tìm bản mới rồi dựng lại, KHÔNG chờ ai bấm nút. Đây là ô Environment thứ TƯ, và là
      # `${...}` duy nhất được thêm vào file này - vì nó là một LỰA CHỌN của người cài, không
      # phải mặc định kỹ thuật: bật lên là Javis tự khởi động lại bất cứ lúc nào có bản mới,
      # cắt ngang việc nền và phiên chat đang chạy. Bỏ trống = tắt, cập nhật bằng nút bấm.
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: ${JAVIS_AUTO_UPDATE:-false}
      WATCHTOWER_POLL_INTERVAL: 86400                       # 24h, chỉ có tác dụng khi bật ở trên
      WATCHTOWER_CLEANUP: "true"                            # dọn image cũ sau khi update
      # One update from the button may take this long: pulling the image AND removing the old
      # container. Watchtower's default is 10 minutes; on a VPS with a slow disk it ran out while
      # Docker was still deleting the old container, Watchtower gave up without creating the new
      # one, and Javis was gone (404) until a Redeploy (owner report 2026-11-13). See `guard`.
      WATCHTOWER_HTTP_API_UPDATE_TIMEOUT: 30m
    # KHÔNG gắn nhãn traefik.*: đây là container nội bộ, không có gì để mở ra Internet.
    labels:
      - traefik.enable=false
    # Theo dõi ĐÚNG container của bản này. Ghi cứng "javis" thì trên VPS có hai bản, Watchtower
    # của bản này sẽ đi cập nhật và restart container của bản kia.
    command: ${JAVIS_NAME:-javis}

  # ------------------------------------------------------------------------
  # Brings Javis back when an update leaves it gone or stopped (owner report 2026-11-13).
  #
  # Watchtower replaces Javis by stopping it, removing it, then creating the new one. If the stop or
  # the removal returns an error (a timeout on a slow disk), it gives up and never creates the new
  # one, while Docker often finishes the removal anyway: no Javis container at all, the domain answers
  # 404 and Docker Manager no longer lists it. The guard keeps a copy of how Javis was created and,
  # after 2 minutes of that state, creates it again (on the new image Watchtower already pulled) or
  # starts it again. A Javis you stop by hand is left alone. Logs: container `javis-guard`.
  #
  # Same Docker socket as Watchtower, but no network at all (network_mode: none) and no form field.
  # The code is docker/guard.py, copied in below by tools/sync_guard.py: edit that file, not this block.
  guard:
    image: python:3.12-alpine
    container_name: ${JAVIS_NAME:-javis}-guard
    restart: unless-stopped
    network_mode: none
    depends_on:
      - javis          # deleting the stack stops the guard first, so it never sees Javis "vanish"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - guard-data:/guard
    environment:
      JAVIS_NAME: ${JAVIS_NAME:-javis}
    labels:
      - traefik.enable=false
    entrypoint: ["python", "-u", "-c"]
    command:
      - |
        """Javis update guard: brings the Javis container back when an update leaves it gone or stopped.

        Watchtower replaces a container in three steps: stop it, remove it, create the new one. When the stop
        or the removal returns an error, it gives up and never creates the new one. The update button gives
        Watchtower 10 minutes for the pull AND the removal, and on a VPS with a slow disk deleting the old
        container can run past that limit, while Docker still finishes the removal on its own a moment later.
        Javis is then simply gone: the domain answers 404 and only a Redeploy brings it back (owner report
        2026-11-13).

        The guard runs beside Watchtower with the same Docker socket. While Javis runs it keeps a copy of how
        that container was created, and it acts only in the states a broken update leaves behind:
          - gone for GRACE seconds: create it again from that copy (on the image its tag points to now,
            which is the new version Watchtower already pulled) and start it;
          - stopped while its image tag already points to a newer image (Watchtower pulled, then the stop
            or the removal failed): start it again, the old version comes back;
          - dead (a removal that broke halfway): remove it and create it again;
          - created by someone else and never started for GRACE seconds: start it.
        A container the owner stops by hand still has its tag on its own image, so the guard leaves it alone.

        Standard library only and no network: the compose service runs it with network_mode none. The
        compose files carry this file inline, where a dollar sign would mean a variable, so it uses none.
        Keep docker-compose.yml and docker-compose.hostinger.yml in step with: python tools/sync_guard.py
        """
        import http.client
        import json
        import os
        import signal
        import socket
        import sys
        import time
        import urllib.parse

        NAME = os.environ.get("JAVIS_NAME") or "javis"
        SOCKET = os.environ.get("JAVIS_GUARD_SOCKET") or "/var/run/docker.sock"
        STORE = os.environ.get("JAVIS_GUARD_DIR") or "/guard"
        EVERY = float(os.environ.get("JAVIS_GUARD_EVERY") or 15)
        GRACE = float(os.environ.get("JAVIS_GUARD_GRACE") or 120)


        def log(msg):
            print(time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "[guard]", msg, flush=True)


        class DockerConnection(http.client.HTTPConnection):
            def __init__(self, timeout):
                super().__init__("localhost", timeout=timeout)

            def connect(self):
                sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                sock.settimeout(self.timeout)
                sock.connect(SOCKET)
                self.sock = sock


        def api(method, path, body=None, timeout=60):
            """(status, decoded JSON or raw text or None) of one Docker Engine API call."""
            conn = DockerConnection(timeout)
            try:
                data = None if body is None else json.dumps(body).encode()
                conn.request(method, path, body=data, headers={"Content-Type": "application/json"} if data else {})
                resp = conn.getresponse()
                raw = resp.read()
            finally:
                conn.close()
            try:
                return resp.status, json.loads(raw) if raw else None
            except ValueError:
                return resp.status, raw.decode("utf-8", "replace")


        def quote(value):
            """For query values. Paths take names and image refs as they are, the way the docker CLI sends them."""
            return urllib.parse.quote(value, safe="")


        def tag_image_id(ref):
            """Image ID the tag points to now, None when it is not on this machine."""
            status, body = api("GET", "/images/" + ref + "/json")
            return body.get("Id") if status == 200 and isinstance(body, dict) else None


        def endpoint(ep, cid, network):
            """Endpoint settings worth carrying over to a new container (runtime fields dropped)."""
            out = {}
            aliases = [a for a in ep.get("Aliases") or [] if a not in (cid, cid[:12])]
            if aliases and network != "bridge":
                out["Aliases"] = aliases
            for key in ("IPAMConfig", "Links", "DriverOpts"):
                if ep.get(key):
                    out[key] = ep[key]
            return out


        def create_spec(snap):
            """(create body, extra networks to connect) from a saved inspect, the way Watchtower builds one.

            Values the container only had because its old image set them (Env, Cmd, Labels...) are dropped,
            so the new image's own defaults apply, as they would after a normal update."""
            c, img = snap["container"], snap.get("image") or {}
            cid = c["Id"]
            cfg = json.loads(json.dumps(c["Config"]))
            host = json.loads(json.dumps(c["HostConfig"]))
            for key, empty in (("WorkingDir", ""), ("User", ""), ("Cmd", None), ("Entrypoint", None),
                               ("Healthcheck", None), ("StopSignal", "")):
                if key in cfg and cfg.get(key) == img.get(key):
                    cfg[key] = empty
            cfg["Env"] = [e for e in cfg.get("Env") or [] if e not in (img.get("Env") or [])]
            old_labels = img.get("Labels") or {}
            cfg["Labels"] = {k: v for k, v in (cfg.get("Labels") or {}).items() if old_labels.get(k) != v}
            for key in ("Volumes", "ExposedPorts"):
                cfg[key] = {k: v for k, v in (cfg.get(key) or {}).items() if k not in (img.get(key) or {})} or None
            if cfg.get("Hostname") == cid[:12]:
                cfg["Hostname"] = ""
            cfg.pop("MacAddress", None)
            # Anonymous volumes live only in the inspect's Mounts; name them so their data comes back too.
            taken = {m.get("Target") for m in host.get("Mounts") or []}
            taken |= {b.split(":")[1] for b in host.get("Binds") or [] if ":" in b}
            for m in c.get("Mounts") or []:
                if m.get("Type") == "volume" and m.get("Name") and m.get("Destination") not in taken:
                    bind = m["Name"] + ":" + m["Destination"] + ("" if m.get("RW", True) else ":ro")
                    host["Binds"] = (host.get("Binds") or []) + [bind]
            networks = (c.get("NetworkSettings") or {}).get("Networks") or {}
            mode = host.get("NetworkMode") or ""
            extra = {}
            cfg["HostConfig"] = host
            if mode in ("host", "none") or mode.startswith("container:") or not networks:
                return cfg, extra
            primary = mode if mode in networks else next(iter(networks))
            cfg["NetworkingConfig"] = {"EndpointsConfig": {primary: endpoint(networks[primary], cid, primary)}}
            for net, ep in networks.items():
                if net != primary:
                    extra[net] = endpoint(ep, cid, net)
            return cfg, extra


        def pull(ref):
            image, _, tag = ref.rpartition(":")
            if not image or "/" in tag or "@" in ref:
                image, tag = ref, ""
            query = "fromImage=" + quote(image) + ("&tag=" + quote(tag) if tag else "")
            status, _ = api("POST", "/images/create?" + query, timeout=1800)
            log("pull " + ref + ": HTTP " + str(status))


        def create(snap, body):
            """POST /containers/create. Compose notes the image ID in a label; it is pointed at the image the
            tag names now, as Watchtower does, so the next `docker compose up` does not recreate it for nothing."""
            new_image = tag_image_id(body.get("Image") or "")
            if new_image and body["Labels"].get("com.docker.compose.image") == snap["container"].get("Image"):
                body["Labels"]["com.docker.compose.image"] = new_image
            return api("POST", "/containers/create?name=" + quote(NAME), body, timeout=300)


        def recreate(snap):
            """Create and start the container from the snapshot. True when it is running again."""
            body, extra = create_spec(snap)
            status, resp = create(snap, body)
            if status == 404:   # the image is not on this machine any more: fetch it, then try once more
                pull(body.get("Image") or "")
                status, resp = create(snap, body)
            if status == 409:
                log("the name " + NAME + " is taken again (Watchtower may have made it meanwhile): leaving it")
                return False
            if status != 201:
                log("create failed: HTTP " + str(status) + " " + str(resp))
                return False
            new_id = resp["Id"]
            for net, ep in extra.items():
                s, r = api("POST", "/networks/" + net + "/connect", {"Container": new_id, "EndpointConfig": ep})
                if s != 200:
                    log("connect to network " + net + " failed: HTTP " + str(s) + " " + str(r))
            return start(new_id)


        def start(ref):
            status, resp = api("POST", "/containers/" + ref + "/start", timeout=300)
            if status in (204, 304):
                log("started " + NAME)
                return True
            log("start failed: HTTP " + str(status) + " " + str(resp))
            return False


        def snapshot_path():
            return os.path.join(STORE, NAME + ".json")


        def load_snapshot():
            try:
                with open(snapshot_path(), encoding="utf-8") as f:
                    return json.load(f)
            except (OSError, ValueError):
                return None


        def save_snapshot(snap):
            try:
                os.makedirs(STORE, exist_ok=True)
                tmp = snapshot_path() + ".tmp"
                with open(tmp, "w", encoding="utf-8") as f:
                    json.dump(snap, f)
                os.replace(tmp, snapshot_path())
            except OSError as e:
                log("could not save the snapshot (kept in memory only): " + str(e))


        class Guard:
            def __init__(self, now=time.monotonic):
                self.now = now
                self.snap = load_snapshot()   # {"container": inspect, "image": its image's Config, "owner_stopped": ID}
                self.since = None             # when the current problem was first seen

            def check(self):
                status, c = api("GET", "/containers/" + NAME + "/json")
                if status == 404:
                    return self.missing()
                if status != 200 or not isinstance(c, dict):
                    return "unknown"
                state = (c.get("State") or {}).get("Status") or ""
                if state in ("running", "restarting", "paused", "removing"):
                    self.since = None
                    snap = self.snap or {}
                    if state == "running" and (snap.get("container", {}).get("Id") != c["Id"] or snap.get("owner_stopped")):
                        s, img = api("GET", "/images/" + c["Image"] + "/json")
                        self.snap = {"container": c, "image": (img or {}).get("Config") if s == 200 else None}
                        save_snapshot(self.snap)
                        log("watching " + NAME + " (" + c["Id"][:12] + ")")
                    return "ok"
                return self.not_running(c, state)

            def waited(self):
                """True once the same problem has lasted GRACE seconds."""
                if self.since is None:
                    self.since = self.now()
                return self.now() - self.since >= GRACE

            def missing(self):
                if not self.snap or not self.waited():
                    return "waiting" if self.snap else "no-snapshot"
                log(NAME + " has been gone for " + str(int(GRACE)) + "s (an update stopped halfway?): creating it again")
                self.since = None
                return "recreated" if recreate(self.snap) else "failed"

            def not_running(self, c, state):
                if c["Id"] == (self.snap or {}).get("owner_stopped"):
                    return "owner-stopped"
                seen = (self.snap or {}).get("container", {}).get("Id")
                if state == "dead":
                    if not self.snap or not self.waited():
                        return "waiting"
                    log(NAME + " is dead (a removal broke halfway): removing it and creating it again")
                    api("DELETE", "/containers/" + c["Id"] + "?force=1", timeout=300)
                    self.since = None
                    return "recreated" if recreate(self.snap) else "failed"
                if c["Id"] == seen and state == "exited":
                    ref = (c.get("Config") or {}).get("Image") or ""
                    if self.since is None and tag_image_id(ref) == c.get("Image"):
                        self.snap["owner_stopped"] = c["Id"]   # kept on disk: a restarted guard leaves it alone too
                        save_snapshot(self.snap)
                        return "owner-stopped"
                    if not self.waited():
                        return "waiting"
                    log(NAME + " was stopped by an update that never finished: starting it again")
                elif state == "created" and c["Id"] != seen:
                    if not self.waited():
                        return "waiting"
                    log(NAME + " was created but never started: starting it")
                else:
                    return "left-alone"
                self.since = None
                return "started" if start(c["Id"]) else "failed"


        def main():
            signal.signal(signal.SIGTERM, lambda *_: sys.exit(0))
            log("guarding container " + NAME + " (checks every " + str(int(EVERY)) + "s, acts after " + str(int(GRACE)) + "s)")
            guard = Guard()
            while True:
                try:
                    guard.check()
                except Exception as e:  # the Docker socket can be busy or briefly gone: try again next round
                    log("check failed: " + type(e).__name__ + ": " + str(e))
                time.sleep(EVERY)


        if __name__ == "__main__":
            main()

  # ------------------------------------------------------------------------
  # HTTPS KHI VPS KHÔNG CÓ TRAEFIK CỦA HOSTINGER (0.300.0).
  #
  # Chủ repo hỏi 24/10/2026: mẫu "Ubuntu 24 + Docker" của Hostinger có sẵn Traefik giữ cổng 80/443 và cấp SSL qua
  # nhãn traefik.* ở trên, còn mẫu Ubuntu 26 trắng thì không có Traefik nào. Trước bản này, dán link compose lên máy
  # Ubuntu 26 là Javis chạy nhưng DOMAIN_NAME không bao giờ có HTTPS (không ai đọc nhãn traefik.*), và muốn có thì
  # phải biết tự ghép thêm file Caddy. Giờ MỘT link dùng được cho cả hai:
  #   - Có proxy khác đang giữ 80/443 (Traefik của Hostinger) -> gateway đứng yên, Traefik cấp SSL như trước.
  #   - Cổng 80/443 trống (Ubuntu 26, VPS trắng) -> gateway chạy Caddy, tự xin + tự gia hạn Let's Encrypt cho
  #     DOMAIN_NAME rồi chuyển vào Javis ở cổng ${JAVIS_HOST_PORT:-7777} của máy.
  #   - Chưa đặt DOMAIN_NAME -> gateway đứng yên, vào bằng http://<ip>:7777 như cũ.
  #
  # Vì sao network_mode: host chứ không publish "80:80"/"443:443": publish cổng mà Traefik đang giữ thì Docker báo
  # "port is already allocated" và CẢ STACK deploy đỏ trên Ubuntu 24. Ở mạng host, Docker không giành cổng nào; chính
  # script dưới đây soi cổng trước, chỉ khi cả 80 lẫn 443 đều trống mới mở Caddy. Đang bận thì 10 phút soi lại một lần
  # (gỡ Traefik đi là gateway tự nhận việc, không phải Redeploy).
  #
  # Caddy chỉ xin chứng chỉ cho ĐÚNG DOMAIN_NAME (không on-demand), nên kẻ trỏ DNS bừa vào IP không ép được nó xin
  # cert lung tung. Không thêm ô nào vào form Environment: chỉ đọc DOMAIN_NAME và JAVIS_HOST_PORT đã có sẵn.
  # Nhiều bản Javis trên một VPS KHÔNG có Traefik: gateway của bản đầu giữ 80/443, bản sau đứng yên -> bản sau dùng
  # docker-compose.proxy.yml (proxy dùng chung), xem DEPLOY.md.
  gateway:
    image: caddy:2-alpine
    container_name: ${JAVIS_NAME:-javis}-gateway
    restart: unless-stopped
    network_mode: host
    # 0.302.0: the VPS's own hostname (srv<id>.hstgr.cloud) is visible here, so with DOMAIN_NAME empty the gateway
    # still gets a link: javis.srv<id>.hstgr.cloud. Hostinger never tells a pasted compose that name at install time.
    uts: host
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      JAVIS_HOST_PORT: ${JAVIS_HOST_PORT:-7777}
      JAVIS_NAME: ${JAVIS_NAME:-javis}
    entrypoint:
      - /bin/sh
      - -c
      - |
        D="$${DOMAIN_NAME:-localhost}"
        P="$${JAVIS_HOST_PORT:-7777}"
        nghi() { while :; do sleep 3600; done; }
        S="/status/gateway.txt"
        ghi() { mkdir -p /status 2>/dev/null; printf 'state=%s\nnames=%s\n' "$$1" "$$2" > "$$S" 2>/dev/null || true; }
        # Chua dat DOMAIN_NAME: lay ten VPS Hostinger (srv<so>.hstgr.cloud) lam link. 0.304.0: KHONG doan qua DNS nua.
        # Ban 0.302.0 so dia chi bang getent, ma getent doc /etc/hosts cua VPS truoc (Ubuntu ghi ten may -> 127.0.1.1),
        # nen Caddy xin cert cho srv<so>.hstgr.cloud con Javis lai cho javis.srv<so>.hstgr.cloud: lech nhau, khong ai
        # duoc chuyen sang https (chu repo bao 24/10/2026). Gio Caddy phuc vu CA HAI ten (<ten-ban>.<may> va, voi ban
        # mac dinh, chinh ten may); ten nao DNS tro ve may thi co cert. Danh sach ghi vao $$S de Javis thu dung cac ten nay.
        if [ "$$D" = "localhost" ] || [ -z "$$D" ]; then
          M="$$( (hostname -f 2>/dev/null || hostname) | tr 'A-Z' 'a-z')"
          case "$$M" in
            *.hstgr.cloud) ;;
            srv[0-9]*) case "$$M" in *.*) M="";; *) M="$$M.hstgr.cloud";; esac;;
            *) M="";;
          esac
          N="$$(echo "$${JAVIS_NAME:-javis}" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9-\n' '-')"
          if [ -n "$$M" ]; then
            D="$$N.$$M"
            [ "$$N" = "javis" ] && D="$$D $$M"
            echo "[gateway] Chua dat DOMAIN_NAME: dung link cua VPS $$D"
          fi
        fi
        case "$$D" in
          ""|localhost) echo "[gateway] DOMAIN_NAME chua dat: khong cap HTTPS, vao bang http://<ip>:$$P"; ghi idle ""; nghi;;
        esac
        for x in $$D; do
          case "$$x" in
            *[!A-Za-z0-9.-]*|*.|.*) echo "[gateway] Ten mien khong hop le: $$x. Khong cap HTTPS."; ghi idle ""; nghi;;
          esac
        done
        # 0050 = cong 80, 01BB = cong 443, 0A = dang LISTEN. Them nc cho truong hop Docker chi dung iptables.
        ban() {
          grep -qiE ':(0050|01BB) [0-9A-F]+:[0-9A-F]+ 0A' /proc/net/tcp /proc/net/tcp6 2>/dev/null && return 0
          nc -z -w 2 127.0.0.1 443 2>/dev/null || nc -z -w 2 127.0.0.1 80 2>/dev/null
        }
        while ban; do
          echo "[gateway] Cong 80/443 da co proxy khac (Traefik cua Hostinger): de no cap HTTPS cho $$D. Soi lai sau 10 phut."
          ghi busy "$$D"
          sleep 600
        done
        echo "[gateway] Khong co Traefik: Caddy cap HTTPS cho $$D -> 127.0.0.1:$$P"
        echo "[gateway] Chung chi khong len? Mo cong 80 va 443 o hPanel > VPS > Tuong lua."
        ghi serving "$$D"
        printf '%s {\n\treverse_proxy 127.0.0.1:%s\n}\n' "$$(echo $$D | sed 's/ /, /g')" "$$P" > /config/Caddyfile
        exec caddy run --config /config/Caddyfile --adapter caddyfile
    volumes:
      - gateway-data:/data       # chứng chỉ đã cấp - giữ qua Redeploy, không xin lại (tránh cạn rate-limit)
      - gateway-config:/config
      # 0.304.0: gateway ghi nó đang làm gì (idle / busy / serving + các tên) vào đây; Javis đọc (chỉ đọc) để trang IP
      # chuyển đúng sang tên Caddy đã xin cert, và Cài đặt > Tên miền nói rõ gateway đang ở bước nào.
      - gateway-status:/status
    labels:
      - traefik.enable=false

# ============================================================================
# NHIỀU BẢN JAVIS TRÊN CÙNG MỘT VPS HOSTINGER
#
# Deploy compose này THÊM MỘT LẦN NỮA (stack mới trong Docker Manager), đổi CẢ BA:
#   Stack 1:  DOMAIN_NAME=shop.srv1782015.hstgr.cloud    JAVIS_NAME=(trống)     JAVIS_HOST_PORT=(trống)
#   Stack 2:  DOMAIN_NAME=canhan.srv1782015.hstgr.cloud  JAVIS_NAME=javis-canhan  JAVIS_HOST_PORT=7778
#
# Cả ba giá trị phải khác nhau giữa các stack. Trùng JAVIS_NAME -> Docker báo tên container đã
# dùng; trùng JAVIS_HOST_PORT -> báo cổng đã bị chiếm; trùng DOMAIN_NAME -> hai bản giành nhau
# một link. Wildcard DNS *.hstgr.cloud của Hostinger có sẵn nên tên miền phụ nào cũng trỏ được ngay.
#
# Mỗi stack có volume riêng, nên state / brain / tài khoản admin / token đăng nhập Claude đều
# TÁCH BẠCH. Đăng nhập Claude phải làm lại một lần cho mỗi bản (App terminal của stack đó).
# ============================================================================

volumes:
  guard-data:
  gateway-status:
  gateway-data:
  gateway-config:
  javis-data:
  javis-brains:
  claude-auth:
  codex-auth:
