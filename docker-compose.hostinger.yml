# ============================================================================
# Javis OS - HOSTINGER VPS (Docker Manager). Tên miền + HTTPS qua Traefik có sẵn của Hostinger.
#
# File này LUÔN deploy được:
#   - Chưa đặt DOMAIN_NAME  -> chạy tạm, vào bằng nút Open / http://<ip>:7777 (chưa có HTTPS).
#   - Đặt DOMAIN_NAME       -> Traefik của Hostinger tự cấp HTTPS cho tên miền đó.
#
# CÁCH DÙNG:
#   1) Docker Manager > Compose > URL > dán:
#      https://raw.githubusercontent.com/blogminhquy/javis-os/main/docker-compose.hostinger.yml
#   2) Ô Environment chỉ còn 4 trường hữu ích:
#        DOMAIN_NAME, JAVIS_ADMIN_USER, JAVIS_ADMIN_PASSWORD, JAVIS_AUTO_UPDATE.
#      (JAVIS_AUTO_UPDATE=true thì Javis TỰ cập nhật mỗi ngày, khỏi bấm nút. Bỏ trống thì
#       cập nhật bằng nút "Cập nhật ngay" trong app - xem service watchtower ở dưới.)
#      (Thêm 2 trường CHỈ CẦN KHI cài bản Javis THỨ HAI trở đi trên cùng VPS - xem cuối file:
#        JAVIS_NAME, JAVIS_HOST_PORT. Cài bản đầu thì bỏ trống cả hai.)
#      Đặt DOMAIN_NAME để có HTTPS:
#        - Link miễn phí (KHÔNG cần mua tên miền):  DOMAIN_NAME=javis.<hostname-vps>.hstgr.cloud
#          (hostname xem ở hPanel > VPS, vd: DOMAIN_NAME=javis.srv1782015.hstgr.cloud)
#        - Hoặc tên miền riêng:  DOMAIN_NAME=tenmien.com  (trỏ DNS A về IP VPS trước).
#   3) Deploy > đợi 1-3 phút Traefik cấp SSL > mở  https://<DOMAIN_NAME>.
#
# KHÔNG tìm thấy ô Environment? Bấm Manage > sửa .yaml, đổi thẳng dòng Host(...) thành tên miền:
#      Host(`javis.srv1782015.hstgr.cloud`)   (thay bằng hostname VPS của bạn).
#
# GHI CHÚ:
#   - Mấu chốt: KHÔNG khai báo networks - Traefik của Hostinger tự thấy container qua nhãn.
#   - Cập nhật bản mới: bấm "Cập nhật ngay" ngay trong app (trang Cập nhật). Nút đó cần
#     container watchtower đi kèm bên dưới; nó không lên được thì vẫn Redeploy như cũ.
#   - VPS KHÔNG phải Hostinger: bỏ file này, dùng docker-compose.yml + docker-compose.https.yml (Caddy).
#   - Image GHCR phải để PUBLIC (GitHub > Packages > javis-os > Package settings > Public).
# ============================================================================
services:
  javis:
    image: ghcr.io/blogminhquy/javis-os:latest
    # Tên container + tên router/service Traefik đều lấy từ JAVIS_NAME. Bỏ trống = "javis" như cũ.
    # Cài bản THỨ HAI trên cùng VPS thì đặt tên khác (vd javis-shop), nếu không Docker báo tên đã
    # dùng và Traefik có hai router trùng tên nên chỉ lái được về một bản.
    container_name: ${JAVIS_NAME:-javis}
    restart: unless-stopped
    pull_policy: always
    # Gắn target Hostinger bên trong lệnh chạy để KHÔNG biến nó thành một trường rác
    # trong ô Environment của Docker Manager.
    command: ["sh", "-c", "JAVIS_DEPLOY_TARGET=hostinger exec python -m uvicorn main:app --app-dir server --host 0.0.0.0 --port 7777"]
    environment:
      # Chỉ giữ các trường người cài thực sự cần. Cổng/đường dẫn/state/brain đã có
      # mặc định đúng trong Docker image, không cần hiện thành một loạt ô kỹ thuật.
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      JAVIS_ADMIN_USER: ${JAVIS_ADMIN_USER:-admin}
      JAVIS_ADMIN_PASSWORD: ${JAVIS_ADMIN_PASSWORD:-}
      # Chung một token với service watchtower bên dưới -> nút "Cập nhật ngay" gọi được nó.
      # ĐÓNG CỨNG chứ không lấy từ biến, có lý do: mỗi `${...}` trong file này đẻ thêm một ô
      # trong form Environment của Docker Manager, mà token này không ai cần đổi - cổng 8080 của
      # Watchtower không publish ra ngoài, chỉ container trong cùng stack gọi tới được.
      # Muốn token riêng thì dùng docker-compose.yml (bản VPS), nó nhận biến WATCHTOWER_TOKEN.
      WATCHTOWER_TOKEN: javis-update
    ports:
      # Đường vào dự phòng (nút Open / http://<ip>:7777). Bản thứ hai PHẢI đổi cổng này
      # (JAVIS_HOST_PORT=7778) vì một cổng máy chủ chỉ một container giữ được.
      - "${JAVIS_HOST_PORT:-7777}:7777"
    labels:
      # Guide (Documentation / Quick start) trong Docker Manager - trỏ docs GitHub.
      - org.opencontainers.image.documentation=https://github.com/blogminhquy/javis-os/blob/main/docs/README.md
      - org.opencontainers.image.source=https://github.com/blogminhquy/javis-os
      - com.hostinger.documentation=https://github.com/blogminhquy/javis-os/blob/main/docs/README.md
      - com.hostinger.quickstart=https://github.com/blogminhquy/javis-os/blob/main/QUICKSTART.md
      # Router/service mang TÊN CỦA BẢN (JAVIS_NAME) chứ không đóng cứng "javis": Traefik đặt tên
      # router theo phạm vi toàn máy, hai bản cùng tên router là bản sau đè bản trước và một
      # trong hai tên miền chết. Bỏ trống JAVIS_NAME thì vẫn ra "javis" y như trước.
      # Host = ${DOMAIN_NAME}; chưa đặt thì mặc định "localhost" (deploy vẫn chạy, chỉ chưa có domain/HTTPS).
      - traefik.enable=true
      - traefik.http.routers.${JAVIS_NAME:-javis}.rule=Host(`${DOMAIN_NAME:-localhost}`)
      - traefik.http.routers.${JAVIS_NAME:-javis}.entrypoints=websecure
      - traefik.http.routers.${JAVIS_NAME:-javis}.tls.certresolver=letsencrypt
      - traefik.http.routers.${JAVIS_NAME:-javis}.service=${JAVIS_NAME:-javis}
      - traefik.http.services.${JAVIS_NAME:-javis}.loadbalancer.server.port=7777
    volumes:
      - javis-data:/data
      - javis-brains:/brains
      - claude-auth:/home/javis/.claude
      - codex-auth:/home/javis/.codex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:'+os.getenv('JAVIS_PORT','7777')+'/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  # ------------------------------------------------------------------------
  # Cập nhật 1-CLICK từ trong app (nút "Cập nhật ngay" ở trang Cập nhật). CÓ SẴN từ 0.55.56.
  #
  # Lịch sử phải nói thật, vì nó là lý do khối này từng KHÔNG có: bản 2026-07-18 đã thử rồi gỡ
  # đi, do trên Docker Manager container Watchtower bị Restarting liên tục (không đụng được
  # Docker socket) và stack hiện "Partially running". Nay đưa lại vì cái giá của việc thiếu nó
  # lớn hơn: máy cài mới không tự cập nhật được, phải nhớ vào Docker Manager bấm Redeploy - mà
  # chủ repo báo đúng cảnh đó (2026-09-08).
  #
  # Điều KHÔNG đổi kể cả khi host chặn socket: container javis ở trên CHẠY BÌNH THƯỜNG. Watchtower
  # là một container RIÊNG, nó hỏng thì chỉ mất cái nút, không kéo theo app. Gặp "Partially
  # running" thì mở log container `javis-watchtower`; không sửa được thì cập nhật bằng REDEPLOY
  # y như trước, trang Cập nhật trong app cũng tự nói ra điều đó.
  watchtower:
    image: containrrr/watchtower
    container_name: ${JAVIS_NAME:-javis}-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_HTTP_API_UPDATE: "true"                    # nhận lệnh cập nhật từ nút bấm
      WATCHTOWER_HTTP_API_TOKEN: javis-update               # khớp WATCHTOWER_TOKEN của app ở trên
      # TỰ tìm bản mới rồi dựng lại, KHÔNG chờ ai bấm nút. Đây là ô Environment thứ TƯ, và là
      # `${...}` duy nhất được thêm vào file này - vì nó là một LỰA CHỌN của người cài, không
      # phải mặc định kỹ thuật: bật lên là Javis tự khởi động lại bất cứ lúc nào có bản mới,
      # cắt ngang việc nền và phiên chat đang chạy. Bỏ trống = tắt, cập nhật bằng nút bấm.
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: ${JAVIS_AUTO_UPDATE:-false}
      WATCHTOWER_POLL_INTERVAL: 86400                       # 24h, chỉ có tác dụng khi bật ở trên
      WATCHTOWER_CLEANUP: "true"                            # dọn image cũ sau khi update
    # KHÔNG gắn nhãn traefik.*: đây là container nội bộ, không có gì để mở ra Internet.
    labels:
      - traefik.enable=false
    # Theo dõi ĐÚNG container của bản này. Ghi cứng "javis" thì trên VPS có hai bản, Watchtower
    # của bản này sẽ đi cập nhật và restart container của bản kia.
    command: ${JAVIS_NAME:-javis}

# ============================================================================
# NHIỀU BẢN JAVIS TRÊN CÙNG MỘT VPS HOSTINGER
#
# Deploy compose này THÊM MỘT LẦN NỮA (stack mới trong Docker Manager), đổi CẢ BA:
#   Stack 1:  DOMAIN_NAME=shop.srv1782015.hstgr.cloud    JAVIS_NAME=(trống)     JAVIS_HOST_PORT=(trống)
#   Stack 2:  DOMAIN_NAME=canhan.srv1782015.hstgr.cloud  JAVIS_NAME=javis-canhan  JAVIS_HOST_PORT=7778
#
# Cả ba giá trị phải khác nhau giữa các stack. Trùng JAVIS_NAME -> Docker báo tên container đã
# dùng; trùng JAVIS_HOST_PORT -> báo cổng đã bị chiếm; trùng DOMAIN_NAME -> hai bản giành nhau
# một link. Wildcard DNS *.hstgr.cloud của Hostinger có sẵn nên tên miền phụ nào cũng trỏ được ngay.
#
# Mỗi stack có volume riêng, nên state / brain / tài khoản admin / token đăng nhập Claude đều
# TÁCH BẠCH. Đăng nhập Claude phải làm lại một lần cho mỗi bản (App terminal của stack đó).
# ============================================================================

volumes:
  javis-data:
  javis-brains:
  claude-auth:
  codex-auth:
