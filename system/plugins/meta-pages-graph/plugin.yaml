name: Facebook Trang (Graph API)
name_en: "Facebook Pages (Graph API)"
slug: meta-pages-graph
version: 1.0.0
description: Quản lý Trang/Fanpage Facebook qua Graph API - liệt kê Trang, đọc bài và bình luận (chỉ đọc), đăng bài/ảnh/video/album, sửa chữ, xoá bài và trả lời bình luận (toàn quyền). Dùng Fanpage đã nối ở thẻ Facebook Messenger (trang Kết nối), hoặc kết nối "Facebook Trang" trong Kho nếu có.
description_en: "Manages Facebook Pages through the Graph API: list Pages, read posts and comments (read-only), publish posts, photos, videos and albums, edit text, delete posts and reply to comments (full access). Uses the Pages connected on the Facebook Messenger card (Connections page), or the store's Facebook Pages connection when present."
author: Javis (bundled)
enabled: true
min_mode: full
tools:
  - fb_pages_list
  - fb_page_posts
  - fb_page_comments
  - fb_page_post
  - fb_page_photo
  - fb_page_album
  - fb_page_video
  - fb_page_edit
  - fb_page_delete
  - fb_page_reply
hooks: []
