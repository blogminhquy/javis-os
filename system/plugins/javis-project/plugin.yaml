description: Cho Javis tự ghi điều học được về một project trong lúc làm việc, tự gắn file và link kèm mô tả một dòng cho project, cộng sự hay nhóm, và sửa hướng dẫn riêng của project khi người dùng bảo. Chỉ phiên của chủ thấy tool này.
description_en: "Lets Javis note what it learns about a project while it works, attach files and links with a one-line description to a project, an assistant or a team, and rewrite the project's instructions when the person asks. Only the owner's own sessions see this tool."
