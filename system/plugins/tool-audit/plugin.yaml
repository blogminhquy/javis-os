name: Nhật ký dùng tool
name_en: "Tool usage log"
slug: tool-audit
version: 1.0.0
description: Đếm số lần MỖI tool được engine gọi (qua hook post_tool_call) và cho xem thống kê tool hay dùng. Đây là ví dụ minh hoạ cơ chế HOOK của plugin. Mặc định TẮT - bật qua POST /plugins/toggle (slug=tool-audit) để thử.
description_en: "Counts how many times EACH tool is called by an engine (through the post_tool_call hook) and shows the most used tools. It is a demo of the plugin HOOK mechanism. OFF by default: turn it on with POST /plugins/toggle (slug=tool-audit) to try it."
author: Javis (bundled)
enabled: false
min_mode: readonly
tools:
  - javis_tool_stats
hooks:
  - post_tool_call
