name: Giao việc Kanban
name_en: "Kanban tasks"
slug: javis-task
version: 1.0.0
description: Giao một việc nền vào hàng đợi Kanban và xem việc đang chạy tới đâu, ngay từ chat. Trước tool này chỉ engine chạy được lệnh máy (Claude Code, Codex) mới giao việc được, vì đường duy nhất là curl POST /kanban/task - năm engine API đứng ngoài.
description_en: "Queues a background task on the Kanban board and shows how far running tasks have got, right from chat. Before this tool only engines that run shell commands (Claude Code, Codex) could queue work, because the only route was curl POST /kanban/task; the five API engines were left out."
author: Javis (bundled)
enabled: true
min_mode: safe
tools:
  - javis_task
hooks: []
