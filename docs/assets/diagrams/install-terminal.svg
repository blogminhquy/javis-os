<text x="60" y="64" fill="#f97316" font-size="16" letter-spacing="2.5" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Courier New', monospace">ONE COMMAND</text>
<text x="60" y="106" fill="#ffffff" font-size="28" font-weight="700" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">From zero to <tspan fill="#f97316">your own AI agent</tspan> in minutes.</text>
