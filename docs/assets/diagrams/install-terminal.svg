@keyframes ol5{0%,50.38%{opacity:0}51.31%,100%{opacity:1}}
.ol5{animation:ol5 13.0s ease-out infinite}
@keyframes ol6{0%,54.62%{opacity:0}55.54%,100%{opacity:1}}
.ol6{animation:ol6 13.0s ease-out infinite}
@keyframes br{0%,59.23%{opacity:0;transform:translateY(48px)}65.00%,100%{opacity:1;transform:translateY(0px)}}
.br{animation:br 13.0s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes sc{0%,90.00%{opacity:1}94.62%,100%{opacity:0}}
.sc{animation:sc 13.0s ease-in-out infinite}
@keyframes blink{0%,49.9%{opacity:1}50%,100%{opacity:0}}
.blink{animation:blink 1.1s steps(1,end) infinite}
