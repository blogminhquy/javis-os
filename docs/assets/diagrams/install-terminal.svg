.cv1{transform:translateX(244.8px);animation:cv1 13.0s linear infinite}
@keyframes cu1{0%,19.62%{opacity:0}19.69%,30.38%{opacity:1}30.46%,100%{opacity:0}}
.cu1{opacity:0;animation:cu1 13.0s linear infinite}
@keyframes ol0{0%,33.08%{opacity:0}34.00%,100%{opacity:1}}
.ol0{animation:ol0 13.0s ease-out infinite}
@keyframes ol1{0%,36.54%{opacity:0}37.46%,100%{opacity:1}}
.ol1{animation:ol1 13.0s ease-out infinite}
