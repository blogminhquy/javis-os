<circle cx="774" cy="361" r="4.5" fill="#4ade80"/>
<text x="788" y="367" fill="#d1d5db" font-size="16" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Courier New', monospace">localhost:7777 <tspan fill="#9ca3af">· Javis OS</tspan></text>
<path d="M784,399 C787.74,412.26 787.74,412.26 801,416 C787.74,419.74 787.74,419.74 784,433 C780.26,419.74 780.26,419.74 767,416 C780.26,412.26 780.26,412.26 784,399Z" fill="#f97316"/>
