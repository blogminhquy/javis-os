<g class="sc">
<g clip-path="url(#tc)" font-size="17" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Courier New', monospace">
<g class="cl0"><text x="92" y="220" fill="#a78bfa">$</text><text x="116" y="220" fill="#e5e7eb" textLength="601.8" lengthAdjust="spacing">git clone https://github.com/blogminhquy/javis-os.git javis</text><g class="cv0"><rect x="116" y="200" width="617.8" height="28" fill="#12121f"/><rect class="cu0" x="117" y="204" width="10" height="20" rx="1.5" fill="#e5e7eb"/></g></g>
<g class="cl1"><text x="92" y="256" fill="#a78bfa">$</text><text x="116" y="256" fill="#e5e7eb" textLength="244.8" lengthAdjust="spacing">cd javis &amp;&amp; ./install.sh</text><g class="cv1"><rect x="116" y="236" width="260.8" height="28" fill="#12121f"/><rect class="cu1" x="117" y="240" width="10" height="20" rx="1.5" fill="#e5e7eb"/></g></g>
<g class="ol0"><text x="92" y="302" fill="#4ade80" font-weight="700">✓</text><text x="116" y="302" fill="#d1d5db">Python environment ready</text></g>
<g class="ol1"><text x="92" y="336" fill="#4ade80" font-weight="700">✓</text><text x="116" y="336" fill="#d1d5db">Claude Code CLI</text><text x="330.2" y="336" fill="#9ca3af">(claude)</text></g>
<g class="ol2"><text x="92" y="370" fill="#4ade80" font-weight="700">✓</text><text x="116" y="370" fill="#d1d5db">ChatGPT via Codex</text><text x="330.2" y="370" fill="#9ca3af">(codex)</text></g>
<g class="ol3"><text x="92" y="404" fill="#4ade80" font-weight="700">✓</text><text x="116" y="404" fill="#d1d5db">Antigravity CLI</text><text x="330.2" y="404" fill="#9ca3af">(agy)</text></g>
<g class="ol4"><text x="92" y="438" fill="#4ade80" font-weight="700">✓</text><text x="116" y="438" fill="#d1d5db">Grok Build</text><text x="330.2" y="438" fill="#9ca3af">(grok)</text></g>
<g class="ol5"><text x="92" y="472" fill="#4ade80" font-weight="700">✓</text><text x="116" y="472" fill="#d1d5db">.env created</text></g>
<g class="ol6"><text x="92" y="516" fill="#f97316">▶</text><text x="116" y="516" fill="#fb923c" font-weight="700" textLength="418.2" lengthAdjust="spacing">Javis is running at http://localhost:7777</text><rect class="blink" x="542.2" y="500" width="10" height="20" rx="1.5" fill="#fb923c"/></g>
</g>
<g class="br">
