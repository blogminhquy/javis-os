<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Install Javis OS with one command</title>
<desc id="d">A terminal clones the javis-os repository, runs install.sh, checks the Python environment, the four subscription CLIs and the .env file, then starts Javis at http://localhost:7777, and a browser window opens the dashboard.</desc>
<defs>
<radialGradient id="gl" cx="0.78" cy="0.2" r="0.75"><stop offset="0" stop-color="#7c3aed" stop-opacity=".14"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
<pattern id="gr" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern>
<clipPath id="tc"><rect x="62" y="186" width="1076" height="372" rx="12"/></clipPath>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<style>
@keyframes cl0{0%,1.15%{opacity:0}1.23%,100%{opacity:1}}
.cl0{animation:cl0 13.0s linear infinite}
@keyframes cv0{0%,3.85%{transform:translateX(0px);animation-timing-function:steps(59,end)}17.69%,100%{transform:translateX(601.8px)}}
.cv0{transform:translateX(601.8px);animation:cv0 13.0s linear infinite}
