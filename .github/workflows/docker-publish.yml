name: Build & Publish Docker image (GHCR)

# Mỗi lần push lên main → build image Docker và đẩy lên GitHub Container Registry
# (ghcr.io/blogminhquy/javis-os). Hostinger Docker Manager / VPS chỉ cần PULL image này.
on:
  push:
    branches: [main]
    # Chỉ bỏ qua build khi push THUẦN tài liệu (không ảnh hưởng image).
    # CLAUDE.md là system prompt nạp vào image → KHÔNG ignore, để sửa nó là build lại.
    paths-ignore:
      - "README.md"
      - "DEPLOY.md"
      - ".learn/**"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Read app version
        run: echo "APP_VERSION=$(cat VERSION | tr -d ' \n\r')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve current Codex CLI version
        shell: bash
        run: |
          version="$(npm view @openai/codex@latest version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid Codex version: $version"; exit 1; }
          echo "CODEX_CLI_VERSION=$version" >> "$GITHUB_ENV"
          echo "Codex CLI: $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            CODEX_CLI_VERSION=${{ env.CODEX_CLI_VERSION }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ env.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
