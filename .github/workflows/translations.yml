name: Translations

# Flags machine translations (docs/i18n/<code>/, except the hand-kept Vietnamese) whose source
# changed after they were translated. Warnings only, never a red build: an outdated translation
# is still better than none, and it must not block an edit to the English README.
on:
  push:
    branches: [ main ]
    paths: [ 'README.md', 'QUICKSTART.en.md', 'docs/i18n/**', 'tools/check_translations.py' ]
  pull_request:
    paths: [ 'README.md', 'QUICKSTART.en.md', 'docs/i18n/**', 'tools/check_translations.py' ]
  workflow_dispatch:

jobs:
  stale:
    name: Stale translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_translations.py --github
