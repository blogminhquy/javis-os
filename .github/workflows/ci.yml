name: M2 owned preflight exact-source Linux
on:
  workflow_dispatch:
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify exact frozen source and assigned isolated checks
        env:
          JAVIS_NO_REAL_JUDGE_ENGINE: '1'
          JAVIS_NO_REAL_REVIEW_ENGINE: '1'
          JAVIS_NO_REAL_TEAM_ENGINE: '1'
        run: |
          python -B - <<'PY'
          import hashlib, importlib.util, json, os, pathlib, re, subprocess, sys, time
          root = pathlib.Path.cwd()
          metadata = json.loads((root / '.ci/m2-preflight-pins.json').read_text())
          for path, pin in metadata['paths'].items():
              raw = pathlib.Path(path).read_bytes()
              assert b'\r' not in raw and len(raw) == pin['size'], path
              assert hashlib.sha256(raw).hexdigest() == pin['sha256'], path
              assert subprocess.check_output(['git','hash-object','--stdin'],input=raw).decode().strip() == pin['git_blob'], path
              print('EXACT_FROZEN_PIN', path, pin['sha256'], flush=True)
          spec = importlib.util.spec_from_file_location('m2_p1_actual_runner', root / 'tests/run.py')
          runner = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(runner)
          bootstrap = "import datetime,os,pathlib,runpy,sys; p=sys.argv.pop(1); sys.path.insert(0,str(pathlib.Path(p).parent)); print('ASSIGNED_ISOLATED_DRIVER',sys.flags.isolated,'PID',os.getpid(),'UTC',datetime.datetime.now(datetime.timezone.utc).isoformat(),p,flush=True); runpy.run_path(p,run_name='__main__')"
          failures, executed = [], 0
          for name, *selectors in metadata['checks']:
              started = time.monotonic()
              print('BEGIN_ASSIGNED_CHECK', name, selectors, flush=True)
              result = runner.chay_mot([sys.executable, '-I', '-B', '-X', 'utf8', '-c', bootstrap, str(root / 'tests/python' / name), *selectors], dict(os.environ))
              print(result.stdout, end='', flush=True)
              print(result.stderr, end='', file=sys.stderr, flush=True)
              print('END_ASSIGNED_CHECK', name, 'SECONDS', round(time.monotonic()-started,3), 'EXIT', result.returncode, flush=True)
              ran = re.search(r'Ran (\d+) tests?', result.stderr)
              skipped = re.search(r'OK \(skipped=(\d+)\)', result.stderr)
              if ran:
                  executed += int(ran.group(1)) - (int(skipped.group(1)) if skipped else 0)
              if result.returncode:
                  failures.append(name)
              if runner._SOT:
                  raise SystemExit('runner retained temporary directories: ' + repr(runner._SOT))
          print('ACTUAL_NONSKIPPED_TEST_METHODS', executed, flush=True)
          if failures or executed == 0:
              raise SystemExit('failed or no executed portable checks: ' + repr(failures))
          PY
