name: Recipe source authority early Linux engineering check
on:
  workflow_dispatch:
jobs:
  recipe-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: Verify exact frozen task sources
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          document = json.loads(pathlib.Path('recipe-source-pins.json').read_text())
          for name, expected in document['sha256'].items():
              actual = hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              print(name, actual, flush=True)
              assert actual == expected, name
          PY
      - name: Run actual focused checks serially with isolated runner
        env:
          PYTHONIOENCODING: utf-8
          JAVIS_NO_REAL_JUDGE_ENGINE: '1'
          JAVIS_NO_REAL_REVIEW_ENGINE: '1'
          JAVIS_NO_REAL_TEAM_ENGINE: '1'
        run: |
          python -B - <<'PY'
          import importlib.util, json, os, pathlib, sys, time
          document = json.loads(pathlib.Path('recipe-source-pins.json').read_text())
          spec = importlib.util.spec_from_file_location('javis_focused_runner', 'tests/run.py')
          runner = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(runner)
          for check in document['checks']:
              started = time.monotonic()
              result = runner.chay_mot([sys.executable, '-B', str(pathlib.Path('tests/python') / check[0]), *check[1:]], dict(os.environ))
              print('CHECK', json.dumps(check), 'SECONDS', round(time.monotonic() - started, 3), 'EXIT', result.returncode, flush=True)
              print(result.stdout, end='', flush=True)
              print(result.stderr, end='', flush=True)
              if result.returncode:
                  raise SystemExit(result.returncode)
          if runner._SOT:
              raise SystemExit('temporary process directories remain: ' + repr(runner._SOT))
          PY
