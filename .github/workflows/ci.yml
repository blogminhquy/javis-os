name: Compose owner panel portable check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compose-panel-portable:
    runs-on: ubuntu-latest
    env:
      JAVIS_NO_REAL_JUDGE_ENGINE: "1"
      JAVIS_NO_REAL_REVIEW_ENGINE: "1"
      JAVIS_NO_REAL_TEAM_ENGINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact selected bytes
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          pins=json.loads(Path('.github/compose-panel-portable-pins.json').read_text())
          for name,expected in pins.items():
              actual=hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual==expected,(name,expected,actual)
          print('Exact selected source/test pins verified:',len(pins))
          PY
      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Serial isolated cold owner and mounted controller fixtures
        run: |
          python - <<'PY'
          import os,runpy,subprocess,sys,time
          from pathlib import Path
          helpers=runpy.run_path('tests/run.py',run_name='compose_panel_portable_helpers')
          for name in ('test_improvement_compose_outcomes.py', 'test_improvement_compose_api.py', 'test_improvement_experiment_main.py', 'test_info_tip_rule.py'):
              started=time.monotonic()
              result=helpers['chay_mot']([sys.executable,'-B',str(Path('tests/python')/name),'-v'],os.environ.copy())
              print(result.stdout+result.stderr,flush=True)
              print(name,'exit',result.returncode,'seconds',round(time.monotonic()-started,3),flush=True)
              if result.returncode: raise SystemExit(result.returncode)
          for name in ('test_improvement_experiments.mjs', 'test_improvement_candidates.mjs', 'test_i18n.mjs'):
              result=subprocess.run(['node',str(Path('tests/js')/name)])
              print(name,'exit',result.returncode,flush=True)
              if result.returncode: raise SystemExit(result.returncode)
          for name in ('improvement-candidates.js','improvement-experiments.js'):
              subprocess.run(['node','--check',str(Path('dashboard')/name)],check=True)
          print('Early scoped panel fixtures complete; no native/account/business qualification.',flush=True)
          PY
