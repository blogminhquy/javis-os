name: Actual Harness2 private library portable check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  library-snapshot-portable:
    runs-on: ubuntu-latest
    env:
      JAVIS_NO_REAL_JUDGE_ENGINE: "1"
      JAVIS_NO_REAL_REVIEW_ENGINE: "1"
      JAVIS_NO_REAL_TEAM_ENGINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact selected bytes
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          pins=json.loads(Path('.github/library-snapshot-portable-pins.json').read_text())
          for name,expected in pins.items():
              actual=hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual==expected,(name,expected,actual)
          print('Exact selected source/test/provenance pins verified:',len(pins))
          PY
      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Isolated actual Library and checked private-root fixtures
        run: |
          python - <<'PY'
          import os,runpy,sys,time
          from pathlib import Path
          helpers=runpy.run_path('tests/run.py',run_name='library_snapshot_portable_helpers')
          name='test_improvement_recipe_snapshot.py'
          started=time.monotonic()
          result=helpers['chay_mot']([sys.executable,'-B',str(Path('tests/python')/name),'-v'],os.environ.copy())
          print(result.stdout+result.stderr,flush=True)
          print(name,'exit',result.returncode,'seconds',round(time.monotonic()-started,3),flush=True)
          if result.returncode: raise SystemExit(result.returncode)
          print('Early derived library component only; canonical/native/account/business integration remains open.',flush=True)
          PY
