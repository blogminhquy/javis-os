name: Early recipe archive migration fixtures
on:
  workflow_dispatch:
jobs:
  recipe-archive-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact selected source and test bytes
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          pins=json.loads(Path('.github/recipe-archive-portable-pins.json').read_text())
          for name,expected in pins.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==expected,name
          print('Exact selected source/test pins verified:',len(pins))
          PY
      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt
      - name: Isolated actual migration and impacted schema fixtures
        env:
          JAVIS_NO_REAL_JUDGE_ENGINE: '1'
          JAVIS_NO_REAL_REVIEW_ENGINE: '1'
          JAVIS_NO_REAL_TEAM_ENGINE: '1'
          PYTHONIOENCODING: utf-8
        run: |
          python -B - <<'PY'
          import os,runpy,sys,time
          from pathlib import Path
          driver=runpy.run_path('tests/run.py')
          for name in ('test_improvement_recipe_schema.py','test_improvement_compose_schema.py'):
              started=time.monotonic()
              result=driver['chay_mot']([sys.executable,'-B',str(Path('tests/python')/name)],dict(os.environ))
              print(result.stdout,end='');print(result.stderr,end='')
              print(name,'exit',result.returncode,'seconds',round(time.monotonic()-started,3),flush=True)
              if result.returncode: raise SystemExit(result.returncode)
          PY
