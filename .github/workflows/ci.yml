name: M2 capability fences exact-source Linux
on:
  workflow_dispatch:
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify frozen source pins
        run: |
          python -B - <<'PY'
          import hashlib, json, pathlib, subprocess
          pins = json.loads(pathlib.Path('.ci/m2-capability-pins.json').read_text())
          for path, expected in pins['paths'].items():
              raw = pathlib.Path(path).read_bytes()
              assert b'\r' not in raw, path
              assert len(raw) == expected['size'], path
              assert hashlib.sha256(raw).hexdigest() == expected['sha256'], path
              blob = subprocess.check_output(['git', 'hash-object', '--stdin'], input=raw).decode().strip()
              assert blob == expected['git_blob'], path
              print('EXACT_FROZEN_PIN', path, expected['sha256'], flush=True)
          PY
      - name: Run only assigned checks through actual isolation
        env:
          PYTHONIOENCODING: utf-8
          JAVIS_NO_REAL_JUDGE_ENGINE: '1'
          JAVIS_NO_REAL_REVIEW_ENGINE: '1'
          JAVIS_NO_REAL_TEAM_ENGINE: '1'
        run: |
          python -B - <<'PY'
          import importlib.util, os, pathlib, sys, time
          root = pathlib.Path.cwd()
          spec = importlib.util.spec_from_file_location('m2_p0_actual_runner', root / 'tests/run.py')
          runner = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(runner)
          checks = [
              ('test_improvement_qualification_admission_fences.py',),
              ('test_improvement_trial_admission.py', 'AdmissionTests.test_unsupported_or_malformed_native_capability_reserves_nothing'),
              ('test_improvement_operation_execution.py', 'OperationExecutionTests.test_no_native_capability_means_no_reserved_call_and_replay_after_off_is_cold'),
              ('test_improvement_trial_runner.py', 'TrialRunnerTests.test_unsupported_adapter_refunds_before_any_query_or_recorder', 'TrialRunnerTests.test_success_orders_marker_and_recorder_before_ack_and_cleanup_before_evaluation'),
              ('test_improvement_operation_runner.py', 'OperationRunnerTests.test_actual_worker_profile_runner_retains_unknown_result_and_cleans_plaintext'),
          ]
          failures = []
          for name, *selectors in checks:
              started = time.monotonic()
              print('BEGIN_ASSIGNED_CHECK', name, selectors, flush=True)
              result = runner.chay_mot([sys.executable, '-B', str(root / 'tests/python' / name), *selectors], dict(os.environ))
              print(result.stdout, end='', flush=True)
              print(result.stderr, end='', file=sys.stderr, flush=True)
              print('END_ASSIGNED_CHECK', name, 'SECONDS', round(time.monotonic() - started, 3), 'EXIT', result.returncode, flush=True)
              if result.returncode:
                  failures.append(name)
              if runner._SOT:
                  raise SystemExit('runner retained temporary directories: ' + repr(runner._SOT))
          if failures:
              raise SystemExit('assigned failures: ' + repr(failures))
          PY
