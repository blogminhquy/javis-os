name: CI

on:
  push:
    # `claude/**` là các nhánh phiên Claude Code làm việc trên repo này. Chúng luôn đẩy commit
    # lên TRƯỚC rồi mới mở PR, mà lúc đó chưa có PR nên `pull_request` không bắt được, và mở
    # PR sau đó có lúc GitHub không sinh run cho commit đã nằm sẵn ở nhánh. Kết quả: nhiều lần
    # phải vào tab Actions bấm chạy tay, dễ sót. Nghe `push` trên đúng tiền tố này thì commit
    # vừa lên là CI chạy ngay.
    # Nhánh có PR mở sẽ chạy hai lần (một do push, một do pull_request). Chấp nhận: repo public
    # nên Actions không tính phút, và hai run xanh đọc rõ hơn là một run bị huỷ giữa chừng.
    branches: [ main, 'claude/**' ]
  # BẮT BUỘC giữ: PR từ fork KHÔNG sinh sự kiện `push` ở repo này, chỉ `pull_request` mới bắt
  # được. Repo đang có hơn 100 fork nên bỏ dòng này là đóng CI với mọi đóng góp bên ngoài.
  pull_request:
  # Chạy tay từ tab Actions. Vẫn giữ làm lối thoát cho nhánh không mang tiền tố `claude/`, và
  # cho việc chạy lại một commit cũ mà không phải đẩy thêm commit rác.
  workflow_dispatch:

# Commit mới lên cùng một PR (hoặc cùng một nhánh) thì huỷ lượt cũ đang chạy dở: lượt cũ kiểm một commit không còn ai merge.
# - Nhóm theo LOẠI SỰ KIỆN + số PR (hay ref): lượt `push` và lượt `pull_request` của cùng một commit nằm hai nhóm khác nhau,
#   không huỷ lẫn nhau (giữ đúng lựa chọn "hai run xanh" ở trên); PR khác, kể cả PR từ fork, có nhóm riêng.
# - `main` không bao giờ bị huỷ: mỗi commit lên main giữ trọn lượt kiểm của nó. Phát hành nằm ở docker-publish.yml, workflow
#   riêng, nên nhóm ở đây không chạm tới.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Test Python chia 2 máy, mỗi máy chạy 4 file cùng lúc (0.344.0). Trước đó một máy chạy lần lượt 940 file mất ~67 phút.
  # Máy ubuntu-latest của repo công khai có 4 nhân và miễn phí. Cách chia nằm ở tests/run.py (`--shard`, `--plan`): danh sách
  # luôn quét từ thư mục nên test mới tự vào đúng một nhóm; tests/test_timings.json chỉ giúp hai nhóm dài bằng nhau.
  python:
    name: Test Python (nhóm ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # Lưới an toàn cuối: bình thường ~10-13 phút. Từng file đã có hạn 20 phút (`--timeout 1200`), nên chạm mốc này
    # nghĩa là chính tests/run.py kẹt. Thiếu dòng này thì GitHub chờ tới trần mặc định 6 tiếng (lượt 26/10 treo 52 phút).
    timeout-minutes: 45
    strategy:
      # Một nhóm đỏ không huỷ nhóm kia: thấy trọn danh sách test đỏ trong một lượt.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      # test_resonance_a1_rollback chạy MÃ 0.86.1 THẬT trên kho đã nâng lên A1 (review PR #590). Checkout mặc định
      # chỉ có một commit, nên lấy riêng commit phát hành đó; thiếu nó thì test đỏ trên CI chứ không tự bỏ qua.
      - name: Lấy commit 0.86.1 cho test quay về
        run: git fetch --no-tags --depth=1 origin 09f254d0e4d009451dc58cb2e97788631c5acc1a

      # test_resonance_a2_rollback chạy MÃ 0.87.0 (A1) THẬT trên kho đã nâng lên A2: commit squash của PR #590 trên main.
      - name: Lấy commit 0.87.0 cho test quay về A2
        run: git fetch --no-tags --depth=1 origin fdfec7c5c84c2663276d088194844e058d9a22aa

      # test_resonance_a3_rollback chạy MÃ 0.88.1 (A2) THẬT trên kho đã nâng lên A3 (`83bff6bc`, PR #596 trên main).
      - name: Lấy commit 0.88.1 cho test quay về A3
        run: git fetch --no-tags --depth=1 origin 83bff6bcf5927c4f6ba83bff576a674f2269c0e5

      # test_resonance_a4_rollback chạy MÃ 0.95.1 THẬT (bản cuối trước A4, `adb103ed`, PR #614 trên main): lập kho cũ,
      # nâng lên A4, rồi khôi phục snapshot.
      - name: Lấy commit 0.95.1 cho test quay về A4
        run: git fetch --no-tags --depth=1 origin adb103ed7f1c61eb21127afd1ba746ee130c6439

      # test_resonance_a5_rollback chạy MÃ 0.108.0 THẬT (bản cuối trước A5, `c4fb614d`, PR #625 trên main): lập kho cũ,
      # nâng lên A5, rồi khôi phục snapshot.
      - name: Lấy commit 0.108.0 cho test quay về A5
        run: git fetch --no-tags --depth=1 origin c4fb614d30b63e592e66a8f943cf2749bb33a412

      # test_team_rollback chạy MÃ 0.139.0 THẬT (bản phát hành cuối trước nhóm chat team, `be1f8aa2` trên main): lập kho
      # Kanban và kho phiên cũ, nâng lên 0.140.0, rồi khôi phục snapshot.
      - name: Lấy commit 0.139.0 cho test quay về nhóm chat team
        run: git fetch --no-tags --depth=1 origin be1f8aa215395471c4640e5e8e109d44e02dc190

      # test_team_adaptive_restore chạy MÃ 0.151.0 THẬT (bản cuối trước chuỗi team-adaptive, `1d1b52fa` trên main): lập ba
      # kho cũ, nâng lên T2, rồi khôi phục snapshot `.pre-0.154.0`.
      - name: Lấy commit 0.151.0 cho test khôi phục team-adaptive
        run: git fetch --no-tags --depth=1 origin 1d1b52faed35a79aa5597f1fbde85b63da2bc3ea

      - name: Fetch 0.292.0 for the improvement schema4 reader check
        run: git fetch --no-tags --depth=1 origin cbef2f464932e533825512e8e11c2299e6b3bf4f

      - name: Fetch 0.293.0 for the improvement schema5 reader check
        run: git fetch --no-tags --depth=1 origin 47f50f707268681dd4cbe8c7e443945155376237

      - name: Fetch 0.296.0 for the improvement schema6 reader check
        run: git fetch --no-tags --depth=1 origin 2727edcc5cdfab6f2dcf2e2871164f22f2771f92

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pytest KHÔNG phải dependency của app nên không nằm trong requirements.txt.
          # Nhóm test Adaptive Runtime viết theo kiểu pytest (fixture tmp_path/monkeypatch);
          # thiếu pytest thì block __main__ của chúng tự bỏ qua và cả trăm test "xanh" mà
          # chưa chạy assertion nào.
          pip install pytest

      # KHÔNG còn vòng lặp shell: tests/run.py chạy từng file trong tiến trình Python riêng, mỗi luồng trên một bản sao repo
      # riêng (trạng thái app nằm trong cây mã, 4 luồng chung một cây là giẫm lên nhau), trả mã 1 khi có file đỏ, in TRỌN
      # output của file đỏ ở cuối log và đẩy tên file đỏ lên phần tóm tắt của trang Actions. Không có `| tee` hay ống nào
      # nuốt mã thoát.
      # Test tự nạp đường dẫn qua tests/python/_paths.py nên chạy được từ bất kỳ thư mục làm việc nào.
      - name: Chạy test Python (auth/secret/MCP-perm/traversal/CSRF + plugin)
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/run.py --py --shard ${{ matrix.shard }}/2 --jobs 4 --timeout 1200 -v

  # Các kiểm tra vốn nằm trong job `test` cũ, ngoài test Python: byte-compile, import thật main, test JS.
  chung:
    name: Byte-compile, import, test JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile toàn bộ server + plugin
        run: python -m compileall -q server system/plugins

      # Byte-compile KHÔNG chạy code nên không thấy vòng import bị gãy. Server có 3 vòng
      # đang được phá bằng import trong hàm (config<->secrets_store, oauth_mcp<->mcp_store,
      # claude_cli<->claude_sdk_engine) cộng 8 module nữa dựa vào mẹo đó. Nâng nhầm một
      # import lên đầu file là app chết lúc khởi động chứ không phải lúc build, mà CI cũ
      # vẫn xanh rồi tự deploy lên VPS. Bước này đóng đúng khe hở đó.
      - name: Import thật main (bắt vòng import mà byte-compile bỏ lọt)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd server
          python -c "import main; print(f'ok, nap duoc main voi {len(main.app.routes)} muc route')"

      # Trước 0.9.242 chỉ 4 trong 11 test JS được liệt tay ở đây, 7 cái còn lại chưa từng
      # chạy lần nào. Nay quét cả thư mục nên thêm test mới là tự chạy.
      # Vòng lặp này in tên file TRƯỚC khi chạy, nên khi một test đỏ thì tên nó nằm lẫn
      # giữa hàng nghìn dòng ở GIỮA log, còn phần đuôi (thứ duy nhất đọc được khi log bị
      # cắt) lại là test cuối cùng - luôn xanh. Vụ 03/09: một test chập chờn làm đỏ CI, và
      # không cách nào biết là test nào nếu không tải nguyên log về. Gom tên lại rồi in ở
      # CUỐI, và đẩy luôn lên phần tóm tắt của GitHub để thấy ngay trên trang Actions.
      - name: Chạy test JS dashboard
        run: |
          status=0
          dsdo=""
          for f in tests/js/test_*.js tests/js/test_*.mjs; do
            echo "==== $(basename "$f") ===="
            node "$f" || { status=1; dsdo="$dsdo $(basename "$f")"; }
          done
          if [ -n "$dsdo" ]; then
            echo ""
            echo "======================================================"
            echo "ĐỎ (test JS):$dsdo"
            echo "======================================================"
            { echo "### Test JS đỏ"; for t in $dsdo; do echo "- \`$t\`"; done; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status

  # Job tổng hợp mang ĐÚNG tên `test`: quy tắc bảo vệ nhánh main đòi check tên này xanh. Nó chỉ xanh khi MỌI job phụ thuộc
  # ra `success`; đỏ, bị huỷ hay bị bỏ qua đều tính là trượt.
  # `if: always()` là bắt buộc: thiếu nó thì job phụ thuộc đỏ làm job này bị BỎ QUA, mà GitHub coi check bị bỏ qua là ĐẠT,
  # tức là PR có test đỏ vẫn merge được. Không dùng `!cancelled()` vì cùng lý do: huỷ lượt chạy thì check này phải đỏ.
  test:
    needs: [python, chung]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Mọi nhóm test đều phải xanh
        env:
          KQ_PYTHON: ${{ needs.python.result }}
          KQ_CHUNG: ${{ needs.chung.result }}
        run: |
          echo "Test Python (2 nhóm): $KQ_PYTHON"
          echo "Byte-compile, import, test JS: $KQ_CHUNG"
          [ "$KQ_PYTHON" = "success" ] && [ "$KQ_CHUNG" = "success" ] || {
            echo "Có job không xanh (failure / cancelled / skipped đều không tính là đạt)."
            exit 1
          }

  # Ảnh Docker nặng thêm bao nhiêu vì thư viện trình duyệt? Build THẬT rồi đọc số, không đoán.
  # KHÔNG đẩy lên registry: workflow phát hành gắn tag `:latest` mà VPS người dùng kéo đúng tag
  # đó, nên một bản build từ nhánh chưa kiểm tuyệt đối không được chạm vào nó.
  do-anh:
    name: Đo kích thước ảnh Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ảnh (không đẩy) và đọc kích thước từng lớp
        run: |
          docker build -t javis-do:pr . 2>&1 | tail -5
          tong=$(docker image inspect javis-do:pr --format '{{.Size}}')
          lop=$(docker history javis-do:pr --no-trunc --format '{{.Size}}|{{.CreatedBy}}' \
                 | grep -i "playwright.*install-deps" | head -1 | cut -d'|' -f1)
          mb() { awk -v b="$1" 'BEGIN{printf "%.0f MB", b/1024/1024}'; }
          echo "Tổng ảnh: $(mb "$tong")"
          echo "Lớp thư viện trình duyệt: ${lop:-（không tìm thấy lớp）}"
          {
            echo "### Kích thước ảnh Docker"
            echo "- Tổng: **$(mb "$tong")**"
            echo "- Riêng thư viện trình duyệt: **${lop:-không đo được}**"
            echo ""
            echo "Trình duyệt KHÔNG nằm trong ảnh - tải bằng nút trong trang Công cụ."
          } >> "$GITHUB_STEP_SUMMARY"
