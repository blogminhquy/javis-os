name: Translation
description: Offer or request a translation of Javis into a language.
title: "[Translation] "
labels: ["translation"]
body:
  - type: markdown
    attributes:
      value: |
        Javis already replies in any language you write in. A translation adds the interface, the docs and the voice in that language.
        The step-by-step guide is docs/dev/adding-a-language.md, and half-finished translations are welcome: anything not yet translated shows in English.
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: "Spanish (es)"
    validations:
      required: true
  - type: checkboxes
    id: parts
    attributes:
      label: What would you like to translate?
      options:
        - label: The README (docs/i18n/<code>/README.md)
        - label: The dashboard interface (dashboard/i18n/<code>.json)
        - label: The connection store (system/mcp-catalog.<code>.json)
        - label: The user guides (docs/)
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Questions, regional variants (pt-BR or pt-PT, for example), or help you need.
